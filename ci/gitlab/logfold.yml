# logfold in GitLab CI. Include this file and extend the hidden job:
#
#   include:
#     - remote: "https://raw.githubusercontent.com/AndreyKilanov/logfold/<tag>/ci/gitlab/logfold.yml"
#
#   logfold:
#     extends: .logfold
#     variables:
#       LOGFOLD_LOG: current.log
#     script:
#       - ./run-tests.sh > current.log 2>&1
#       - !reference [.logfold, script]

.logfold:
  image: python:3.13
  variables:
    LOGFOLD_LOG: ""
    LOGFOLD_FAIL_ON: "--fail-on-new-alerts"
    LOGFOLD_EXAMPLES: "masked"
    LOGFOLD_MASKS: ""
    LOGFOLD_MASKS_FILE: ""
    LOGFOLD_VERSION: ""
  cache:
    key: logfold-baseline
    paths:
      - .logfold/baseline.json
      - .logfold/baseline.masks
    policy: pull-push
  script:
    - |
      mkdir -p .logfold
      pip install --quiet --disable-pip-version-check "logfold[cli]${LOGFOLD_VERSION:+==$LOGFOLD_VERSION}"
      set --
      if [ -n "$LOGFOLD_MASKS" ]; then set -- --masks "$LOGFOLD_MASKS"; fi
      OLD_IFS=$IFS; IFS=,
      for file in $LOGFOLD_MASKS_FILE; do set -- "$@" --masks-file "$file"; done
      IFS=$OLD_IFS
      scope=nomasks
      if [ -n "$LOGFOLD_MASKS$LOGFOLD_MASKS_FILE" ]; then
        scope=m$(python -c 'import hashlib, importlib.metadata as m, sys; h = hashlib.sha256(m.version("logfold").encode() + b"\0" + sys.argv[1].encode()); [h.update(b"\0" + open(p, "rb").read()) for p in filter(None, sys.argv[2].split(","))]; print(h.hexdigest()[:12])' "$LOGFOLD_MASKS" "$LOGFOLD_MASKS_FILE")
      fi
      baseline=.logfold/baseline.json
      if [ -f "$baseline" ] && [ "$(cat .logfold/baseline.masks 2>/dev/null || echo nomasks)" != "$scope" ]; then
        echo "The baseline was made with other masks: it is not used."
        baseline=""
      fi
      logfold analyze "$LOGFOLD_LOG" --examples "$LOGFOLD_EXAMPLES" "$@" --out .logfold/current.json -q
      rc=0
      if [ -f "$baseline" ]; then
        logfold diff "$baseline" .logfold/current.json --out .logfold/junit.xml -q || true
        logfold diff "$baseline" .logfold/current.json --out .logfold/diff.html $LOGFOLD_FAIL_ON -q || rc=$?
      else
        echo "No baseline yet: this run is only analyzed. A passing run on the default branch becomes the baseline."
        logfold analyze "$LOGFOLD_LOG" --examples "$LOGFOLD_EXAMPLES" "$@" --out .logfold/diff.html -q
      fi
      if [ "$rc" -eq 0 ] && [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        cp .logfold/current.json .logfold/baseline.json
        echo "$scope" > .logfold/baseline.masks
      fi
      exit "$rc"
  artifacts:
    when: always
    paths:
      - .logfold/diff.html
    reports:
      junit: .logfold/junit.xml
