[package]
name = "logfold-bench"
description = "Criterion benchmarks of logfold hot paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
criterion = "0.5"
logfold-core = { path = "../logfold-core" }
logfold-io = { path = "../logfold-io" }
logfold-engine = { path = "../logfold-engine" }

[[bench]]
name = "hot_paths"
harness = false
