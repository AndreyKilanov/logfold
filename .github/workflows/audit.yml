name: Audit

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - pyproject.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  rust:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit

  python:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Pin the dependencies of the project and its dev extra
        run: uv pip compile pyproject.toml --extra dev --python-version 3.13 -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
