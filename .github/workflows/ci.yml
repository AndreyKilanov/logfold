name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Check that the domain and the report crates depend on no workspace crate
        shell: bash
        run: |
          for crate in logfold-core logfold-report; do
            if cargo tree -p "$crate" -e normal --prefix none | tail -n +2 | grep -q '^logfold-'; then
              echo "$crate must not depend on a workspace crate"
              exit 1
            fi
          done
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude logfold-py --exclude logfold-bench

  rust-minimum:
    name: Rust 1.99 (minimum supported version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude logfold-py --exclude logfold-bench

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Create environment and build the extension
        shell: bash
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python maturin 2>/dev/null || uv pip install --python .venv/Scripts/python.exe maturin
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          maturin develop --release --extras dev
      - name: Lint, types and layering
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          ruff check .
          ruff format --check .
          mypy
          lint-imports
      - name: Tests
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -q
