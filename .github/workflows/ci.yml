name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude logfold-py --all-targets -- -D warnings
      - run: cargo test --workspace --exclude logfold-py --exclude logfold-bench

  rust-minimum:
    name: Rust 1.99 (minimum supported version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude logfold-py --all-targets -- -D warnings
      - run: cargo test --workspace --exclude logfold-py --exclude logfold-bench

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Create environment and build the extension
        shell: bash
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python maturin 2>/dev/null || uv pip install --python .venv/Scripts/python.exe maturin
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          maturin develop --release --extras dev
      - name: Lint, types and layering
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          ruff check .
          ruff format --check .
          mypy
          lint-imports
      - name: Tests
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -q

  pure-python-fallback:
    name: Pure-Python engine without the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sources without compiling
        run: |
          python -m pip install pytest hypothesis jsonschema typer rich
          echo "PYTHONPATH=$PWD/python" >> "$GITHUB_ENV"
      - name: Run the engine-independent tests
        run: python -m pytest -q tests/api/test_api.py tests/engines/test_formats.py tests/api/test_diff.py tests/reporters tests/plugins/test_plugins.py tests/plugins/test_default_plugins.py tests/plugins/test_plugin_catalog.py tests/cli/test_cli_plugins.py tests/plugins/test_user_plugins.py
        env:
          LOGFOLD_ENGINE: python
