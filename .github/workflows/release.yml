name: Release

on:
  push:
    tags: ["v*"]

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
