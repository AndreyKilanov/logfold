name: Wheels

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "python/**"
      - "pyproject.toml"
      - "Cargo.*"
      - ".github/workflows/wheels.yml"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: windows-x86_64, runner: windows-latest, target: x64, manylinux: auto }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: auto }
          - { name: macos-arm64, runner: macos-14, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.99.0"
          args: --release --out dist
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  smoke:
    name: Install and run (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheels: wheels-linux-x86_64 }
          - { os: windows-latest, wheels: wheels-windows-x86_64 }
          - { os: macos-14, wheels: wheels-macos-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheels }}
          path: dist
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv smoke
          source smoke/bin/activate 2>/dev/null || source smoke/Scripts/activate
          pip install --no-index --find-links dist "logfold[cli]" || pip install --find-links dist "logfold[cli]"
          printf '2026-10-04T12:00:00Z INFO user 1 logged in\n2026-10-04T12:00:01Z INFO user 2 logged in\n' > smoke.log
          logfold --version
          logfold info
          logfold analyze smoke.log -q

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish-check:
    name: Publish download and metadata
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Expect six wheels and one source archive with valid metadata
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -eq 7
          pipx run twine check --strict dist/*
