name: Performance problem
description: Slow run, high memory, or a regression
labels: ["type:perf"]
body:
  - type: textarea
    id: numbers
    attributes:
      label: Numbers
      description: Wall time, throughput, peak RSS, command, input size and format.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and versions
      description: CPU, cores, RAM, disk type, OS, logfold version, thread count.
    validations:
      required: true
