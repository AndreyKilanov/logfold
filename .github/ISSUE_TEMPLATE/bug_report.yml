name: Bug report
description: Something produces a wrong result, crashes or hangs
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual vs expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproducer
      description: Command or Python snippet, input shape (format, size, a few sample lines with secrets removed).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `logfold --version`, Python version, OS, engine (native / python)."
    validations:
      required: true
