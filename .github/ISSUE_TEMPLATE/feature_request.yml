name: Feature request
description: Propose new behavior or an extension point
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired API / CLI shape. Mention whether it changes a public contract.
    validations:
      required: true
