[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logfold-example-plugin"
version = "0.1.0"
description = "Example logfold plugins: three log formats, two reporters and two diff matchers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["logfold>=0.1.0"]

[project.entry-points."logfold.formats"]
example-logfmt = "logfold_example_plugin:LOGFMT"
example-serilog-clef = "logfold_example_plugin:SERILOG_CLEF"
example-ci-blocks = "logfold_example_plugin:CI_BLOCKS"

[project.entry-points."logfold.reporters"]
example-markdown = "logfold_example_plugin:MarkdownReporter"
example-csv = "logfold_example_plugin:CsvReporter"

[project.entry-points."logfold.matchers"]
example-first-word = "logfold_example_plugin:FirstWordMatcher"
example-jaccard = "logfold_example_plugin:JaccardMatcher"

[tool.setuptools]
packages = ["logfold_example_plugin"]
